<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era das Tavernas - Compendium</title>
    
    <!-- Favicon da Taverna (Com Forçador de Atualização de Cache) -->
    <link rel="shortcut icon" type="image/png" href="./favicon.png?v=1">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: rgba(12, 12, 15, 0.4);
            --gold: #d4af37;
            --gold-dim: #8a7322;
            --text-light: #d1d1d1;
            --font-epic: 'Cinzel', serif;
            --card-width: 167px;
            --card-height: 224px;
            --card-radius: 6px;
            
            /* Cores Sóbrias do Drop Mítico */
            --mythic-blue: #0077ff; 
            --mythic-blue-glow: rgba(0, 119, 255, 0.5);
            --mythic-blue-bright: #66b2ff; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
            background-image: radial-gradient(circle at 50% 0%, #15151a 0%, var(--bg-dark) 100%);
            overflow-x: hidden;
        }

        h1, h2, h3, input, button { font-family: var(--font-epic); }

        /* --- TELAS DE ACESSO --- */
        #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .login-box { 
            background-color: #0c0c0f; padding: 3rem; border: 1px solid #15151a; border-top: 1px solid var(--gold-dim);
            text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); width: 400px;
        }
        .login-box h2 { color: var(--gold); font-size: 2rem; margin-bottom: 2rem; letter-spacing: 4px; }

        .auth-tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #1a1a1f; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.9rem; padding: 5px 10px; transition: 0.3s; letter-spacing: 1px;}
        .tab-btn.active { color: var(--gold); border-bottom: 1px solid var(--gold); }

        .auth-form { display: flex; flex-direction: column; gap: 15px; display: none; }
        .auth-form.active { display: flex; }
        .auth-form input { background: #050505; border: 1px solid #222; color: var(--gold); padding: 12px; text-align: center; width: 100%; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .auth-form input:focus { border-color: var(--gold-dim); }

        .divider { margin: 25px 0; border-top: 1px solid #1a1a1f; position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #0c0c0f; padding: 0 10px; color: #444; font-size: 0.7rem; font-family: var(--font-epic); letter-spacing: 1px; }

        /* --- CONTEÚDO PRINCIPAL --- */
        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; padding: 0 2rem 4rem; }
        
        .container { 
            background-color: transparent; 
            border-top: 1px solid rgba(212, 175, 55, 0.2); 
            padding: 3rem 0; 
            width: 100%; max-width: 1050px; 
            text-align: center; 
            margin-top: 80px; 
            position: relative; 
        }
        
        .hero-seal { width: 50px; height: 50px; background: var(--bg-dark); border: 1px solid var(--gold-dim); position: absolute; top: -25px; left: 50%; transform: translateX(-50%) rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .hero-seal::after { content: ""; width: 8px; height: 8px; background: var(--gold-dim); transform: rotate(-45deg); border-radius: 50%; }

        h1 { font-size: 2.2rem; letter-spacing: 3px; font-weight: 400; margin-bottom: 0.5rem; color: var(--text-light); text-transform: uppercase; }
        .subtitle { color: #555; font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 2.5rem; text-transform: uppercase; }

        /* --- CONTROLES --- */
        .controls-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 3.5rem; }

        .input-group { display: flex; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; }
        .input-group input { background: #0a0a0c; border: 1px solid #1f1f24; border-right: none; color: var(--gold); padding: 12px 25px; font-size: 1rem; outline: none; width: 260px; text-align: center; letter-spacing: 2px; transition: 0.3s; }
        .input-group input:focus { background: #000; border-color: var(--gold-dim); }
        
        button { background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); padding: 12px 25px; cursor: pointer; transition: 0.3s; font-weight: 400; letter-spacing: 2px; }
        button:hover { background: rgba(212, 175, 55, 0.15); }
        
        .btn-invocar { background: #0c0c0f; color: var(--gold); border: 1px solid var(--gold-dim); font-weight: 700; }
        .btn-invocar:hover { background: var(--gold); color: #000; }

        .btn-share { background: transparent; color: #666; border: 1px solid #222; font-size: 0.75rem; padding: 8px 24px; border-radius: 30px; letter-spacing: 1px; }
        .btn-share:hover { border-color: var(--gold-dim); color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        
        .btn-google { border-color: #222; color: #666; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .btn-google:hover { border-color: #fff; color: #fff; background: transparent; }
        .btn-logout { font-size: 0.7rem; border: none; color: #444; text-decoration: underline; margin-top: 50px; padding: 5px; }
        .btn-logout:hover { background: transparent; color: var(--gold); }

        /* --- GRID E CARTAS --- */
        .special-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 3.5rem;
            min-height: var(--card-height);
        }

        .album-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr)); 
            gap: 25px; 
            justify-items: center;
        }
        
        .card { 
            width: var(--card-width); 
            height: var(--card-height); 
            background: transparent; 
            border-radius: var(--card-radius);
            position: relative; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: default;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        .card.revealed { cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        .card.revealed:not(.special-card):hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.15); }
        .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; border-radius: var(--card-radius); transition: 0.3s; display: block; }
        .card:not(.revealed) img { opacity: 1; filter: none; }

        /* ========================================================
           AURA PRISMÁTICA (CONTORNO MINIMALISTA E ELEGANTE)
           ======================================================== */
        .special-card {
            transform: scale(1.1);
            border: none;
            overflow: visible !important;
            z-index: 10;
            animation: dbz-float-sober 3s ease-in-out infinite;
            background: transparent;
        }

        /* O Contorno Brilhante Fino (Linha Rente) */
        .special-card::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px; /* Apenas 3px maior que a carta */
            border-radius: calc(var(--card-radius) + 2px);
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9c88ff, #ff4757);
            background-size: 300% 100%;
            z-index: -1;
            animation: flow-contour 2.5s linear infinite;
            filter: blur(2px); /* Efeito neon fino e controlado */
            opacity: 0.9;
        }

        /* O Brilho de Fundo Suave */
        .special-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--card-radius);
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9c88ff, #ff4757);
            background-size: 300% 100%;
            z-index: -2;
            filter: blur(12px); 
            opacity: 0.3;
            animation: flow-contour 2.5s linear infinite, pulse-contour 2s ease-in-out infinite alternate;
        }

        /* Hover: O contorno acelera levemente */
        .special-card:hover {
            transform: scale(1.15) translateY(-5px);
        }

        .special-card:hover::before {
            filter: blur(3px);
            animation-duration: 1.5s;
        }

        .special-card:hover::after {
            opacity: 0.6;
            filter: blur(16px);
            animation-duration: 1.5s, 1s;
        }

        @keyframes flow-contour {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes pulse-contour {
            0% { opacity: 0.2; }
            100% { opacity: 0.5; }
        }

        @keyframes dbz-float-sober {
            0%, 100% { transform: scale(1.1) translateY(0); }
            50% { transform: scale(1.1) translateY(-3px); }
        }
        /* ======================================================== */

        /* --- POPUP / MODAL --- */
        #card-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; animation: fadeIn 0.3s ease; backdrop-filter: blur(5px); }
        #modal-img { max-width: 90%; max-height: 85vh; border-radius: var(--card-radius); box-shadow: 0 0 50px rgba(0,0,0,1); animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        /* --- SISTEMAS DE ANIMAÇÃO FRONT-END UNIFICADO --- */
        #summon-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(12,12,15,0.95) 0%, rgba(0,0,0,0.98) 100%);
            z-index: 9999; display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .pack-floater {
            position: relative;
            animation: float-pack 3s ease-in-out infinite;
            transform: scale(1.45);
            transition: transform 0.3s ease;
            z-index: 10;
        }
        .pack-floater:hover { transform: scale(1.50); }

        /* FX ONDA DE CHOQUE MÍTICA (PRISMÁTICA) */
        .pack-floater::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 100px; height: 100px;
            background: radial-gradient(circle, #ffffff 0%, #ff4757 20%, #1e90ff 50%, rgba(0,0,0,0) 70%); 
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%; opacity: 0; pointer-events: none; z-index: 999;
            mix-blend-mode: screen;
        }
        .pack-floater.explode-fx::before { animation: epic-shockwave-prismatic 1s ease-out forwards; }

        .pack-base {
            width: var(--card-width); height: var(--card-height); 
            border-radius: var(--card-radius);
            background-image: url('card_verso.jpeg'); background-size: cover; background-position: center;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.6);
            cursor: pointer; transition: all 0.3s; position: relative;
            pointer-events: auto;
        }

        .pack-base::after {
            content: attr(data-text); 
            position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
            color: var(--gold); font-family: var(--font-epic); font-size: 0.70rem; letter-spacing: 2px; white-space: nowrap;
            animation: pulse-text 1.5s infinite;
        }

        .pack-floater:hover .pack-base { box-shadow: 0 0 90px rgba(212, 175, 55, 1); filter: brightness(1.2); }
        
        .pack-base.shaking { animation: shake-pack 0.4s cubic-bezier(.36,.07,.19,.97) both infinite; }
        .pack-base.explode { opacity: 0; filter: brightness(3); transition: 0.5s; pointer-events: none; }

        /* Build-up Mítico (Luz Intensa) */
        .pack-base.shaking-epic { animation: build-up-tension-prismatic 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        
        /* Estrutura 3D das Cartas Animadas */
        .anim-card-wrapper {
            position: fixed; width: var(--card-width); height: var(--card-height);
            left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1.45); 
            perspective: 1500px; z-index: 10000; opacity: 0; pointer-events: none;
        }

        .anim-card-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 2.0s cubic-bezier(0.25, 1, 0.4, 1);
            border-radius: var(--card-radius);
            box-shadow: 0 0 20px rgba(212,175,55,0.4);
        }

        .anim-card-inner.flip { transform: rotateY(1620deg); box-shadow: 0 0 60px rgba(212,175,55,0.8); }
        
        /* Pulso Prismático durante o evento de revelação no ar */
        .anim-card-inner.flip.mythic-glow { animation: mythic-pulse-reveal-prismatic 2s infinite alternate ease-in-out; }
        @keyframes mythic-pulse-reveal-prismatic {
            0% { box-shadow: 0 0 8px rgba(255, 71, 87, 0.6), 0 0 15px rgba(255, 165, 2, 0.4); }
            33% { box-shadow: 0 0 8px rgba(46, 213, 115, 0.8), 0 0 15px rgba(30, 144, 255, 0.5); }
            66% { box-shadow: 0 0 8px rgba(155, 89, 182, 0.7), 0 0 15px rgba(255, 71, 87, 0.5); }
            100% { box-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(30, 144, 255, 0.8); }
        }

        .anim-card-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: var(--card-radius); overflow: hidden;
        }

        .anim-card-back { background-size: cover; background-position: center; } 
        .anim-card-front { transform: rotateY(180deg); background: #000; }
        .anim-card-front img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .anim-card-front::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 1; z-index: 2; border-radius: var(--card-radius); }
        .anim-card-wrapper.reveal .anim-card-front::after { opacity: 0; transition: opacity 1.5s ease-out; }

        /* Aura Externa Branca do Flash */
        .anim-card-wrapper::before {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 60%);
            opacity: 0; pointer-events: none; mix-blend-mode: screen; z-index: 10;
            transition: opacity 0.3s ease-in;
        }
        .anim-card-wrapper.flash-peak::before { opacity: 1; }
        .anim-card-wrapper.flash-fade::before { opacity: 0; transition: opacity 1.5s ease-out; }

        /* KEYFRAMES GERAIS */
        @keyframes epic-shockwave-prismatic { 
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 
            40% { opacity: 1; box-shadow: 0 0 200px rgba(255,255,255,1); } 
            100% { transform: translate(-50%, -50%) scale(30); opacity: 0; } 
        }
        
        @keyframes build-up-tension-prismatic {
            0% { transform: translateX(0) rotate(0); filter: brightness(1); }
            50% { filter: brightness(2) drop-shadow(0 0 20px rgba(156, 136, 255, 0.8)); }
            100% { transform: translateX(0) rotate(0); filter: brightness(4) drop-shadow(0 0 40px rgba(255, 255, 255, 1)); box-shadow: 0 0 200px #fff; }
        }
        
        @keyframes float-pack { 0%, 100% { transform: scale(1.45) translateY(0); } 50% { transform: scale(1.45) translateY(-10px); } }
        @keyframes pulse-text { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes shake-pack { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-4deg); } 75% { transform: translateX(6px) rotate(4deg); } }
        
        .hide-on-print { display: flex; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>TAVERNA</h2>
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLogin">ENTRAR</button>
                <button class="tab-btn" id="tabSignup">CRIAR CONTA</button>
            </div>
            <div class="auth-form active" id="formLogin">
                <input type="email" id="emailLogin" placeholder="E-MAIL">
                <input type="password" id="passLogin" placeholder="SENHA">
                <button id="btnEmailLogin">Acessar</button>
            </div>
            <div class="auth-form" id="formSignup">
                <input type="text" id="nameSignup" placeholder="NOME DE JOGADOR">
                <input type="email" id="emailSignup" placeholder="E-MAIL">
                <input type="password" id="passSignup" placeholder="SENHA">
                <button id="btnEmailSignup">Registrar</button>
            </div>
            <div class="divider"><span>OU</span></div>
            <button id="btnGoogleLogin" class="btn-google">Acessar com Google</button>
        </div>
    </div>

    <!-- Overlay da Animação UNIFICADO -->
    <div id="summon-overlay" class="hide-on-print">
        <div class="pack-floater">
            <div id="pack-element" class="pack-base" data-text=""></div>
        </div>
    </div>

    <div id="main-app">
        <div class="container" id="album-container">
            <div class="hero-seal"></div>
            <h1>Compêndio de <span id="displayNome" style="color: #fff;"></span></h1>
            <p class="subtitle hide-on-print">Panteão dos Deuses</p>
            
            <div class="controls-wrapper hide-on-print">
                <div class="input-group">
                    <input type="text" id="codigoInput" placeholder="CÓDIGO" maxlength="25">
                    <button id="btnResgatar" class="btn-invocar">INVOCAR</button>
                </div>
                <button id="btnShare" class="btn-share">Copiar Compêndio</button>
            </div>

            <div id="specialCardContainer" class="special-container"></div>
            <div class="album-grid" id="albumGrid"></div>
            <button id="btnLogout" class="btn-logout hide-on-print">Abandonar Taverna</button>
        </div>
    </div>

    <div id="card-modal" class="hide-on-print">
        <img id="modal-img" src="" alt="Carta Expandida">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpWcTqqQ14qNd0LAZcF8hWdc27snlBzRk",
            authDomain: "album-de-cartas-59265.firebaseapp.com",
            projectId: "album-de-cartas-59265",
            storageBucket: "album-de-cartas-59265.firebasestorage.app",
            messagingSenderId: "1083766972634",
            appId: "1:1083766972634:web:eb725ea6afbddc102385e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        const NOMES_DOS_DEUSES = ["amaterasu", "susanoo", "tsukuyomi", "quetzalcoatl", "huitzilopochtli", "tezcatlipoca","ra", "isis", "set", "zeus", "hades", "poseidon", "demeter", "freyr", "odin", "thor", "loki", "shennong", "fuxi", "nuwa", "cronos", "urano", "gaia"];
        const TOTAL_SLOTS = NOMES_DOS_DEUSES.length;
        const cartasDisponiveis = NOMES_DOS_DEUSES.map((nome, index) => ({ id: index + 1, imagem: `card_${nome}.jpeg` }));

        const modal = document.getElementById('card-modal');
        const modalImg = document.getElementById('modal-img');
        modal.onclick = () => modal.style.display = 'none';
        function openModal(imgSrc) { modalImg.src = imgSrc; modal.style.display = 'flex'; }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-app").style.display = "flex";
                await carregarDados();
            } else {
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
            }
        });

        async function carregarDados() {
            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                const dados = snap.data();
                renderizarGrid(dados.cartas_desbloqueadas || [], dados.carta_especial);
                document.getElementById("displayNome").innerText = (dados.nome || "Guerreiro").toUpperCase();
            }
        }

        function renderizarGrid(cartasIds, cartaEspecialId) {
            const specialContainer = document.getElementById('specialCardContainer');
            specialContainer.innerHTML = '';
            if (cartaEspecialId && cartasIds.length >= TOTAL_SLOTS) {
                const specialImg = `especial_${cartaEspecialId}.jpeg`; 
                const specialCardDiv = document.createElement('div');
                specialCardDiv.className = 'card revealed special-card';
                specialCardDiv.innerHTML = `<img src="${specialImg}" style="display:block">`;
                specialCardDiv.onclick = () => openModal(specialImg);
                specialContainer.appendChild(specialCardDiv);
            }

            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            const cartasSeguras = cartasIds.map(id => Number(id));
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const temEssaCarta = cartasSeguras.includes(i);
                const cartaDados = cartasDisponiveis.find(c => c.id === i);
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card' + (temEssaCarta ? ' revealed' : '');
                cardDiv.innerHTML = temEssaCarta ? `<img src="${cartaDados.imagem}" style="display:block">` : `<img src="card_verso.jpeg" style="display:block">`;
                if (temEssaCarta) cardDiv.onclick = () => openModal(cartaDados.imagem);
                grid.appendChild(cardDiv);
            }
        }

        // --- SISTEMA DE ANIMAÇÃO UNIFICADO ---
        async function executarFluxoAnimacao(itensNormais, itemEspecial) {
            const overlay = document.getElementById('summon-overlay');
            const pack = document.getElementById('pack-element');
            const floater = document.querySelector('.pack-floater');
            const baseScale = 1.45;

            return new Promise(async resolve => {
                overlay.style.display = 'flex';
                pack.style.display = 'block';
                pack.style.opacity = '1';
                pack.style.pointerEvents = 'auto';
                pack.style.backgroundImage = "url('card_verso.jpeg')";
                pack.setAttribute('data-text', 'CLIQUE PARA REVELAR A CARTA');
                pack.classList.remove('explode', 'shaking', 'shaking-epic');
                floater.classList.remove('explode-fx');
                document.querySelectorAll('.anim-card-wrapper').forEach(e => e.remove());

                pack.onclick = async () => {
                    pack.onclick = null;
                    pack.classList.add('shaking'); 
                    await new Promise(r => setTimeout(r, 1000)); 
                    pack.classList.remove('shaking');
                    pack.classList.add('explode'); 
                    await new Promise(r => setTimeout(r, 400));
                    pack.style.display = 'none';

                    const animCards = [];
                    itensNormais.forEach((item, index) => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'anim-card-wrapper';
                        const inner = document.createElement('div');
                        inner.className = 'anim-card-inner';
                        const faceBack = document.createElement('div');
                        faceBack.className = 'anim-card-face anim-card-back';
                        
                        faceBack.style.backgroundImage = "url('card_verso.jpeg')"; 

                        const faceFront = document.createElement('div');
                        faceFront.className = 'anim-card-face anim-card-front';
                        const img = document.createElement('img');
                        img.src = cartasDisponiveis.find(c => c.id === item.id).imagem;
                        faceFront.appendChild(img);
                        inner.appendChild(faceBack);
                        inner.appendChild(faceFront);
                        wrapper.appendChild(inner);
                        overlay.appendChild(wrapper);
                        animCards.push({ wrapper, inner });

                        wrapper.style.transform = `translate(-50%, -50%) scale(${baseScale})`;
                        wrapper.style.opacity = '0';
                        setTimeout(() => {
                            const offset = (index - (itensNormais.length - 1) / 2) * 220;
                            wrapper.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease-out';
                            wrapper.style.transform = `translate(calc(-50% + ${offset}px), -50%) scale(${baseScale})`;
                            wrapper.style.opacity = '1';
                        }, 100 * index);
                    });

                    await new Promise(r => setTimeout(r, 1200));
                    animCards.forEach(({wrapper, inner}, index) => {
                        setTimeout(() => {
                            const offset = (index - (itensNormais.length - 1) / 2) * 220;
                            wrapper.style.transition = 'transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease, left 1.2s ease-in-out, top 1.2s ease-in-out';
                            wrapper.style.transform = `translate(calc(-50% + ${offset}px), -50%) scale(${baseScale})`;
                            wrapper.style.zIndex = "1000" + index; 
                            inner.classList.add('flip');
                            setTimeout(() => { wrapper.classList.add('flash-peak'); }, 1700);
                            setTimeout(() => {
                                wrapper.classList.remove('flash-peak');
                                wrapper.classList.add('flash-fade', 'reveal');
                            }, 2000);
                        }, index * 1000);
                    });

                    await new Promise(r => setTimeout(r, 3800 + (animCards.length * 1000)));
                    animCards.forEach(({wrapper}, index) => {
                        const target = document.querySelectorAll('.album-grid .card')[itensNormais[index].id - 1];
                        if (target) {
                            const rect = target.getBoundingClientRect();
                            wrapper.style.left = `${rect.left}px`; wrapper.style.top = `${rect.top}px`;
                            wrapper.style.transform = `translate(0px, 0px) scale(1)`; 
                            wrapper.style.opacity = '0'; 
                        }
                    });

                    await new Promise(r => setTimeout(r, 1200));
                    document.querySelectorAll('.anim-card-wrapper').forEach(e => e.remove());

                    // --- PARTE MÍTICA ---
                    if (itemEspecial) {
                        await new Promise(r => setTimeout(r, 500)); 
                        pack.style.display = 'block';
                        pack.style.opacity = '1';
                        pack.style.pointerEvents = 'auto';
                        
                        pack.style.backgroundImage = "url('verso_mitico.jpeg')";
                        pack.setAttribute('data-text', 'O PANTEÃO ESTÁ COMPLETO. CLIQUE PARA O DROP MÍTICO.');
                        
                        pack.classList.remove('explode', 'shaking', 'shaking-epic');
                        floater.classList.remove('explode-fx');

                        pack.onclick = async () => {
                            pack.onclick = null;
                            pack.classList.add('shaking-epic'); 
                            await new Promise(r => setTimeout(r, 1500)); 
                            pack.classList.remove('shaking-epic');
                            pack.style.display = 'none'; 
                            floater.classList.add('explode-fx'); 
                            
                            const wrapper = document.createElement('div');
                            wrapper.className = 'anim-card-wrapper';
                            const inner = document.createElement('div');
                            inner.className = 'anim-card-inner';
                            const fBack = document.createElement('div'); fBack.className = 'anim-card-face anim-card-back';
                            
                            fBack.style.backgroundImage = "url('verso_mitico.jpeg')"; 

                            const fFront = document.createElement('div'); fFront.className = 'anim-card-face anim-card-front';
                            const img = document.createElement('img'); img.src = `especial_${itemEspecial.id}.jpeg`;
                            fFront.appendChild(img); inner.appendChild(fBack); inner.appendChild(fFront); wrapper.appendChild(inner);
                            overlay.appendChild(wrapper);

                            wrapper.style.transform = `translate(-50%, -50%) scale(${baseScale})`;
                            wrapper.style.opacity = '0';
                            setTimeout(() => { wrapper.style.transition = 'opacity 0.6s ease-out'; wrapper.style.opacity = '1'; }, 50);

                            await new Promise(r => setTimeout(r, 1200));
                            wrapper.style.transition = 'transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease, left 1.2s ease-in-out, top 1.2s ease-in-out';
                            inner.classList.add('flip');
                            setTimeout(() => { wrapper.classList.add('flash-peak'); }, 1700);
                            setTimeout(() => {
                                wrapper.classList.remove('flash-peak');
                                wrapper.classList.add('flash-fade', 'reveal');
                                inner.classList.add('mythic-glow');
                            }, 2000);

                            await new Promise(r => setTimeout(r, 5000));
                            const target = document.getElementById('specialCardContainer');
                            const rect = target.getBoundingClientRect();
                            wrapper.style.left = `${rect.left}px`; wrapper.style.top = `${rect.top}px`;
                            wrapper.style.transform = `translate(0px, 0px) scale(1)`; wrapper.style.opacity = '0'; 
                            await new Promise(r => setTimeout(r, 1200));
                            overlay.style.display = 'none';
                            resolve();
                        };
                    } else {
                        overlay.style.display = 'none';
                        resolve();
                    }
                };
            });
        }

        document.getElementById('btnResgatar').onclick = async () => {
            const cod = document.getElementById("codigoInput").value.trim().toUpperCase();
            if (!cod) return alert("Mestre, insira um código válido.");
            const codigoSnap = await getDoc(doc(db, "codigos", cod));
            if (!codigoSnap.exists() || codigoSnap.data().ativo === false) return alert("Código inválido ou selado.");

            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const snap = await getDoc(userRef);
            const d = snap.data();
            if (d.codigos_usados?.includes(cod)) return alert("Este feitiço já foi lançado por você!");

            let cartasParaAdicionar = [];
            const atuais = (d.cartas_desbloqueadas || []).map(Number);
            let faltantes = cartasDisponiveis.map(c => c.id).filter(id => !atuais.includes(id));

            if (atuais.length >= TOTAL_SLOTS && d.carta_especial) return alert("Seu compêndio já está completo!");

            const numSorteio = Math.min(3, TOTAL_SLOTS - atuais.length);
            for (let i = 0; i < numSorteio; i++) {
                if (faltantes.length > 0) {
                    const idx = Math.floor(Math.random() * faltantes.length);
                    cartasParaAdicionar.push(faltantes[idx]);
                    faltantes.splice(idx, 1);
                }
            }

            const totalApos = new Set([...atuais, ...cartasParaAdicionar.map(Number)]);
            let updateData = { cartas_desbloqueadas: arrayUnion(...cartasParaAdicionar), codigos_usados: arrayUnion(cod) };
            
            let ganhouMítica = false;
            if (totalApos.size >= TOTAL_SLOTS && !d.carta_especial) {
                const mythicId = Math.floor(Math.random() * 4) + 1;
                updateData.carta_especial = mythicId;
                ganhouMítica = true;
            }

            await updateDoc(userRef, updateData);
            document.getElementById("codigoInput").value = "";
            
            await executarFluxoAnimacao(cartasParaAdicionar.map(id => ({id})), ganhouMítica ? {id: updateData.carta_especial} : null);
            await carregarDados();
        };

        // --- BOTÃO COMPARTILHAR CORRIGIDO ---
        document.getElementById('btnShare').onclick = async () => {
            const btn = document.getElementById('btnShare');
            const textoOriginal = btn.innerText;
            btn.innerText = "Gerando Imagem...";
            btn.disabled = true;

            try {
                // Esconde os controles da interface
                document.querySelectorAll('.hide-on-print').forEach(e => e.style.display = 'none');
                
                const canvas = await html2canvas(document.body, { 
                    backgroundColor: '#070709', 
                    scale: 2,
                    useCORS: true 
                });
                
                // RESTAURAÇÃO CORRETA:
                document.querySelectorAll('.hide-on-print').forEach(e => {
                    // SE FOR O OVERLAY DE ANIMAÇÃO OU O MODAL, GARANTE QUE VOLTE INVISÍVEL
                    if(e.id === 'summon-overlay' || e.id === 'card-modal') {
                        e.style.display = 'none';
                    } else {
                        e.style.display = 'flex';
                    }
                });

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                if (!blob) throw new Error("Falha na geração da imagem");

                try {
                    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                    alert("Compêndio copiado com sucesso! Cole diretamente no WhatsApp ou Discord (Ctrl+V).");
                } catch (clipboardError) {
                    const imgURL = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.download = `Compendio_Tavernas.png`;
                    link.href = imgURL;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(imgURL);
                    alert("Seu navegador bloqueou a cópia direta, mas o Compêndio foi salvo nos seus Downloads!");
                }
            } catch (error) {
                console.error("Erro ao gerar compêndio:", error);
                alert("Os deuses bloquearam a visão! Erro ao gerar a imagem.");
                
                // Tratamento de erro também precisa restaurar corretamente
                document.querySelectorAll('.hide-on-print').forEach(e => {
                    if(e.id === 'summon-overlay' || e.id === 'card-modal') {
                        e.style.display = 'none';
                    } else {
                        e.style.display = 'flex';
                    }
                });
            } finally {
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        };

        document.getElementById('tabLogin').onclick = () => { document.getElementById('formLogin').classList.add('active'); document.getElementById('formSignup').classList.remove('active'); document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabSignup').classList.remove('active'); };
        document.getElementById('tabSignup').onclick = () => { document.getElementById('formSignup').classList.add('active'); document.getElementById('formLogin').classList.remove('active'); document.getElementById('tabSignup').classList.add('active'); document.getElementById('tabLogin').classList.add('active'); };
        document.getElementById('btnGoogleLogin').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        document.getElementById('btnEmailLogin').onclick = () => { const email = document.getElementById('emailLogin').value.trim(); const pass = document.getElementById('passLogin').value; if (!email || !pass) return alert("Preencha os campos."); signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro: " + e.message)); };
        document.getElementById('btnEmailSignup').onclick = async () => { const name = document.getElementById('nameSignup').value.trim(); const email = document.getElementById('emailSignup').value.trim(); const pass = document.getElementById('passSignup').value; if (!name || !email || !pass) return alert("Preencha todos os campos."); try { const res = await createUserWithEmailAndPassword(auth, email, pass); await updateProfile(res.user, { displayName: name }); await setDoc(doc(db, "usuarios", res.user.uid), { nome: name, email: email, cartas_desbloqueadas: [], codigos_usados: [] }); location.reload(); } catch (e) { alert("Erro ao cadastrar: " + e.message); } };
    </script>
</body>
</html>
