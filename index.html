<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era das Tavernas - Compendium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: #0c0c0f;
            --gold: #d4af37;
            --gold-dim: #8a7322;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --text-light: #d1d1d1;
            --font-epic: 'Cinzel', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
            background-image: radial-gradient(circle at 50% 0%, #15151a 0%, var(--bg-dark) 80%);
        }

        h1, h2, h3, input, button { font-family: var(--font-epic); }

        #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .login-box { 
            background-color: var(--panel-bg); padding: 3rem; border: 1px solid #1f1f24; border-top: 2px solid var(--gold-dim);
            text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); width: 400px;
        }
        .login-box h2 { color: var(--gold); font-size: 2rem; margin-bottom: 2rem; letter-spacing: 3px; }

        .auth-tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.9rem; padding: 5px 10px; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        .auth-form { display: flex; flex-direction: column; gap: 15px; display: none; }
        .auth-form.active { display: flex; }
        .auth-form input { background: #000; border: 1px solid #333; color: var(--gold); padding: 10px; text-align: center; width: 100%; font-size: 0.9rem; outline: none; }

        .divider { margin: 25px 0; border-top: 1px solid #222; position: relative; }
        .divider span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); padding: 0 10px; color: #444; font-size: 0.8rem; font-family: var(--font-epic); }

        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; padding: 2rem; }
        .container { background-color: var(--panel-bg); border: 1px solid #1a1a1f; border-top: 2px solid var(--gold-dim); padding: 4rem 2rem 3rem; width: 100%; max-width: 1000px; text-align: center; margin-top: 60px; position: relative; }
        .hero-seal { width: 80px; height: 80px; background: #000; border: 1px solid var(--gold); position: absolute; top: -40px; left: 50%; transform: translateX(-50%) rotate(45deg); display: flex; align-items: center; justify-content: center; }
        .hero-seal::after { content: "⚔️"; transform: rotate(-45deg); font-size: 1.5rem; }

        .input-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 2rem; }
        button { background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); padding: 10px 25px; cursor: pointer; transition: 0.4s; font-weight: 600; letter-spacing: 1px; }
        button:hover { background: var(--gold); color: #000; }
        
        .btn-google { border-color: #444; color: #888; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #fff; color: #000; }

        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding-top: 2rem; border-top: 1px solid #1a1a1f; }
        .card { width: 150px; height: 210px; background: #050505; border: 1px dashed #222; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .card.revealed { border: 1px solid var(--gold); box-shadow: 0 0 15px var(--gold-glow); }
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
        .card.revealed img { display: block; }
        .card-placeholder { color: #111; font-size: 3rem; }
        .watermark { position: absolute; bottom: 0; width: 100%; text-align: center; font-size: 0.6rem; color: rgba(212, 175, 55, 0.5); background: linear-gradient(to top, #000, transparent); padding: 5px 0; display: none; font-weight: bold; }
        .card.revealed .watermark { display: block; }
        .hide-on-print { display: flex; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Taverna</h2>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLogin">Entrar</button>
                <button class="tab-btn" id="tabSignup">Criar Conta</button>
            </div>

            <div class="auth-form active" id="formLogin">
                <input type="email" id="emailLogin" placeholder="E-MAIL">
                <input type="password" id="passLogin" placeholder="SENHA">
                <button id="btnEmailLogin">Entrar</button>
            </div>

            <div class="auth-form" id="formSignup">
                <input type="text" id="nameSignup" placeholder="NOME DE JOGADOR">
                <input type="email" id="emailSignup" placeholder="E-MAIL">
                <input type="password" id="passSignup" placeholder="SENHA">
                <button id="btnEmailSignup">Cadastrar</button>
            </div>

            <div class="divider"><span>OU</span></div>

            <button id="btnGoogleLogin" class="btn-google">
                <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.6-5.6C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5c3.3 6.5 10 10.9 17.8 10.9z"/><path fill="#1976D2" d="M43.6 20H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
                Google
            </button>
        </div>
    </div>

    <div id="main-app">
        <div class="container" id="album-container">
            <div class="hero-seal"></div>
            <h1>Compêndio de <span id="displayNome" style="color: #fff;"></span></h1>
            <p class="hide-on-print">Invoque as cartas dos deuses.</p>

            <div class="input-group hide-on-print">
                <input type="text" id="codigoInput" placeholder="CÓDIGO">
                <button id="btnResgatar">Invocar</button>
            </div>

            <button id="btnShare" class="btn-share hide-on-print">📸 Copiar Compêndio</button>

            <div class="album-grid" id="albumGrid"></div>
            <button id="btnLogout" class="btn-logout hide-on-print" style="margin-top: 40px; font-size: 0.7rem; border-color: #222;">Abandonar Taverna</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpWcTqqQ14qNd0LAZcF8hWdc27snlBzRk",
            authDomain: "album-de-cartas-59265.firebaseapp.com",
            projectId: "album-de-cartas-59265",
            storageBucket: "album-de-cartas-59265.firebasestorage.app",
            messagingSenderId: "1083766972634",
            appId: "1:1083766972634:web:eb725ea6afbddc102385e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        const TOTAL_SLOTS = 10;
        
        // ---- AQUI ESTÃO AS SUAS CARTAS ----
        const cartasDisponiveis = [
            { id: 1, imagem: "ra_teste.jpeg" }, // Sua nova imagem adicionada aqui!
            { id: 2, imagem: "https://via.placeholder.com/150x210/111/d4af37?text=Alfheim" },
            { id: 3, imagem: "https://via.placeholder.com/150x210/111/d4af37?text=Odin" },
            { id: 4, imagem: "https://via.placeholder.com/150x210/111/d4af37?text=Zeus" },
            { id: 5, imagem: "https://via.placeholder.com/150x210/111/d4af37?text=Isis" },
            { id: 6, imagem: "https://via.placeholder.com/150x210/111/d4af37?text=Elite" }
        ];

        const codigosValidos = ["TAVERNA-LIVE", "EPICO2026", "BRIGA-BAR"];

        document.getElementById('tabLogin').onclick = () => {
            document.getElementById('formLogin').classList.add('active');
            document.getElementById('formSignup').classList.remove('active');
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabSignup').classList.remove('active');
        };
        document.getElementById('tabSignup').onclick = () => {
            document.getElementById('formSignup').classList.add('active');
            document.getElementById('formLogin').classList.remove('active');
            document.getElementById('tabSignup').classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
        };

        document.getElementById('btnGoogleLogin').onclick = () => signInWithPopup(auth, provider);

        document.getElementById('btnEmailSignup').onclick = async () => {
            const name = document.getElementById('nameSignup').value.trim();
            const email = document.getElementById('emailSignup').value.trim();
            const pass = document.getElementById('passSignup').value;

            if (!name || !email || !pass) return alert("Preencha todos os campos.");

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                
                const userRef = doc(db, "usuarios", res.user.uid);
                await setDoc(userRef, { 
                    nome: name, 
                    email: email, 
                    cartas_desbloqueadas: [], 
                    codigos_usados: [] 
                });
                
                location.reload(); 
            } catch (e) { alert("Erro ao cadastrar: " + e.message); }
        };

        document.getElementById('btnEmailLogin').onclick = () => {
            const email = document.getElementById('emailLogin').value.trim();
            const pass = document.getElementById('passLogin').value;
            if (!email || !pass) return alert("Preencha os campos.");
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro: " + e.message));
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-app").style.display = "flex";
                await carregarDados();
            } else {
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
            }
        });

        async function carregarDados() {
            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const snap = await getDoc(userRef);
            let nomeParaExibir = usuarioAtual.displayName || "Guerreiro";

            if (snap.exists()) {
                const dados = snap.data();
                nomeParaExibir = dados.nome || nomeParaExibir;
                renderizarGrid(dados.cartas_desbloqueadas, nomeParaExibir);
            } else {
                await setDoc(userRef, { 
                    nome: nomeParaExibir, 
                    email: usuarioAtual.email, 
                    cartas_desbloqueadas: [], 
                    codigos_usados: [] 
                });
                renderizarGrid([], nomeParaExibir);
            }
            
            document.getElementById("displayNome").innerText = nomeParaExibir.toUpperCase();
        }

        function renderizarGrid(cartasIds, nome) {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const idCarta = cartasIds[i - 1];
                const cartaDados = cartasDisponiveis.find(c => c.id === idCarta);
                
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card' + (idCarta ? ' revealed' : '');
                cardDiv.id = `slot-${i}`;
                
                cardDiv.innerHTML = `
                    <div class="card-placeholder">?</div>
                    <img src="${idCarta ? cartaDados.imagem : ''}" style="${idCarta ? 'display:block' : ''}">
                    <div class="watermark" style="${idCarta ? 'display:block' : ''}">${nome}</div>
                `;
                grid.appendChild(cardDiv);
            }
        }

        document.getElementById('btnResgatar').onclick = async () => {
            const cod = document.getElementById("codigoInput").value.trim().toUpperCase();
            if (!codigosValidos.includes(cod)) return alert("Código inválido.");

            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const snap = await getDoc(userRef);
            const d = snap.data();

            if (d.codigos_usados?.includes(cod)) return alert("Código já utilizado.");
            if (d.cartas_desbloqueadas.length >= TOTAL_SLOTS) return alert("Seu álbum está completo!");

            let sorteio = [];
            for (let i = 0; i < Math.min(3, TOTAL_SLOTS - d.cartas_desbloqueadas.length); i++) {
                sorteio.push(cartasDisponiveis[Math.floor(Math.random() * cartasDisponiveis.length)].id);
            }

            await updateDoc(userRef, { 
                cartas_desbloqueadas: arrayUnion(...sorteio), 
                codigos_usados: arrayUnion(cod) 
            });
            document.getElementById("codigoInput").value = "";
            await carregarDados();
        };

        document.getElementById('btnShare').onclick = async () => {
            document.querySelectorAll('.hide-on-print').forEach(e => e.style.display = 'none');
            const canvas = await html2canvas(document.body, { backgroundColor: '#070709', scale: 2 });
            canvas.toBlob(async (blob) => {
                const imgURL = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                link.download = `compendio-${usuarioAtual.displayName || 'taverna'}.png`;
                link.href = imgURL;
                link.click();
                try {
                    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                    alert("Copiado! Agora é só colar (Ctrl+V) no WhatsApp.");
                } catch { alert("Compêndio salvo nos downloads!"); }
                document.querySelectorAll('.hide-on-print').forEach(e => e.style.display = 'flex');
            });
        };
    </script>
</body>
</html>
