<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era das Tavernas - Compendium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Fonte Épica (Cinzel) e Fonte Base (Inter ou Segoe UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: #0c0c0f;
            --gold: #d4af37;
            --gold-dim: #8a7322;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --text-light: #d1d1d1;
            --border-radius: 2px; /* Cantos mais retos e agressivos */
            --font-epic: 'Cinzel', serif;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: var(--font-body);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            background-image: radial-gradient(circle at 50% 0%, #15151a 0%, var(--bg-dark) 80%);
        }

        /* --- TIPOGRAFIA ÉPICA --- */
        h1, h2, .card-placeholder, input, button {
            font-family: var(--font-epic);
        }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        
        .login-box { 
            background-color: var(--panel-bg); 
            padding: 4rem 3rem; 
            border: 1px solid #1f1f24; 
            border-top: 2px solid var(--gold-dim);
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); 
            position: relative;
        }
        
        .login-box h2 { 
            color: var(--gold); 
            font-size: 2.2rem;
            margin-bottom: 0.5rem; 
            letter-spacing: 4px; 
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .login-box p {
            font-family: var(--font-epic);
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
        }

        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; padding: 2rem; }
        
        .container { 
            background-color: var(--panel-bg); 
            border: 1px solid #1a1a1f; 
            border-top: 2px solid var(--gold-dim);
            padding: 4rem 2rem 3rem; 
            width: 100%; 
            max-width: 1000px; 
            text-align: center; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7); 
            margin-top: 60px; 
            position: relative; 
        }
        
        .hero-seal { 
            width: 100px; 
            height: 100px; 
            background: #000; 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: absolute; 
            top: -50px; 
            left: 50%; 
            transform: translateX(-50%) rotate(45deg); /* Transformado em um losango */
            box-shadow: 0 0 20px var(--gold-glow); 
        }
        
        .hero-seal::after { 
            content: "⚔️"; 
            font-size: 2rem; 
            transform: rotate(-45deg); /* Desfaz a rotação para o ícone ficar reto */
        }

        h1 { 
            font-size: 2.5rem; 
            color: var(--gold); 
            letter-spacing: 3px; 
            margin-top: 1rem; 
            margin-bottom: 0.5rem; 
            font-weight: 700;
        }
        
        p { color: #555; margin-bottom: 2.5rem; font-size: 0.95rem; }

        /* --- BOTÕES E INPUTS (Estilo Ghost/Premium) --- */
        input { 
            background-color: #030304; 
            border: 1px solid #333; 
            color: var(--gold); 
            padding: 12px 20px; 
            font-size: 1.2rem; 
            outline: none; 
            width: 280px; 
            transition: all 0.3s ease; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-align: center;
        }
        
        input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }
        
        .input-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 3rem; }

        button { 
            background-color: transparent; 
            color: var(--gold); 
            border: 1px solid var(--gold-dim); 
            padding: 12px 30px; 
            font-size: 1rem;
            font-weight: 600; 
            letter-spacing: 2px;
            cursor: pointer; 
            transition: all 0.4s ease; 
        }
        
        button:hover { 
            background-color: var(--gold); 
            color: #000; 
            box-shadow: 0 0 20px var(--gold-glow); 
        }

        /* Variações de Botões */
        .btn-google { border-color: #555; color: #ccc; display: flex; align-items: center; gap: 12px; margin: 0 auto; }
        .btn-google:hover { background-color: #fff; color: #000; border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        .btn-share { border-color: #1a5e33; color: #25D366; margin-bottom: 3rem; display: flex; align-items: center; gap: 10px; margin-left: auto; margin-right: auto; }
        .btn-share:hover { background-color: #25D366; color: #000; border-color: #25D366; box-shadow: 0 0 20px rgba(37, 211, 102, 0.3); }
        
        .btn-logout { border-color: #333; color: #666; font-size: 0.8rem; padding: 8px 20px; margin-top: 3rem; }
        .btn-logout:hover { background-color: #ff3333; color: #fff; border-color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.3); }

        /* --- GRID E CARTAS --- */
        .album-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; 
            justify-items: center; 
            padding-top: 2rem; 
            border-top: 1px solid #1a1a1f; 
        }
        
        .card { 
            width: 160px; 
            height: 224px; /* Proporção clássica de TCG (2.5x3.5) */
            background-color: #050505; 
            border: 1px dashed #222; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            transition: all 0.5s ease; 
            user-select: none; 
        }
        
        .card.revealed { 
            border: 1px solid var(--gold); 
            background-color: #000; 
            box-shadow: 0 0 20px var(--gold-glow); 
        }
        
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
        .card.revealed img { display: block; }
        
        .card-placeholder { color: #1a1a1a; font-size: 4rem; font-weight: 900; }
        .card.revealed .card-placeholder { display: none; }
        
        .watermark { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            text-align: center; 
            font-size: 0.65rem; 
            color: rgba(212, 175, 55, 0.5); /* Marca d'água agora é dourada sutil */
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 10px 0 5px; 
            display: none; 
            font-family: var(--font-body);
            font-weight: bold; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }
        .card.revealed .watermark { display: block; }
        
        .hide-on-print { display: flex; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Portões da Taverna</h2>
            <p>Apresente-se para acessar o compêndio</p>
            <button id="btnGoogleLogin" class="btn-google">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                Revelar Identidade
            </button>
        </div>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="main-app">
        <div class="container" id="album-container">
            <div class="hero-seal"></div>
            <h1>Compêndio de <span id="displayNome" style="color: #fff;"></span></h1>
            
            <p class="hide-on-print">Os deuses aguardam o seu chamado.</p>

            <div class="input-group hide-on-print">
                <input type="text" id="codigoInput" placeholder="CÓDIGO DE RESGATE" maxlength="15">
                <button id="btnResgatar">Invocar</button>
            </div>

            <button id="btnShare" class="btn-share hide-on-print">📸 Forjar Cópia (Copiar Imagem)</button>

            <div class="album-grid" id="albumGrid">
                <!-- Slots gerados via JS -->
            </div>

            <button id="btnLogout" class="btn-logout hide-on-print">Abandonar a Taverna</button>
        </div>
    </div>

    <!-- O SCRIPT DO FIREBASE CONTINUA INTACTO AQUI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpWcTqqQ14qNd0LAZcF8hWdc27snlBzRk",
            authDomain: "album-de-cartas-59265.firebaseapp.com",
            projectId: "album-de-cartas-59265",
            storageBucket: "album-de-cartas-59265.firebasestorage.app",
            messagingSenderId: "1083766972634",
            appId: "1:1083766972634:web:eb725ea6afbddc102385e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        const TOTAL_SLOTS = 10;
        
        const cartasDisponiveis = [
            { id: 1, imagem: "https://via.placeholder.com/160x224/111111/d4af37?text=Map:+Acropolis" },
            { id: 2, imagem: "https://via.placeholder.com/160x224/111111/d4af37?text=Map:+Alfheim" },
            { id: 3, imagem: "https://via.placeholder.com/160x224/111111/d4af37?text=God:+Odin" },
            { id: 4, imagem: "https://via.placeholder.com/160x224/111111/d4af37?text=God:+Zeus" },
            { id: 5, imagem: "https://via.placeholder.com/160x224/111111/d4af37?text=God:+Isis" },
            { id: 6, imagem: "https://via.placeholder.com/160x224/111111/d4af37?text=Player+Elite" }
        ];

        const codigosValidos = ["TAVERNA-LIVE","EPICO2026","BRIGA-BAR","teste-pain"];
    

        function iniciarAlbumHTML() {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                grid.innerHTML += `
                    <div class="card" id="slot-${i}">
                        <div class="card-placeholder">?</div>
                        <img src="" alt="Carta">
                        <div class="watermark"></div>
                    </div>
                `;
            }
        }
        iniciarAlbumHTML();

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            signInWithRedirect(auth, provider).catch(error => {
                console.error("Erro no login:", error);
                alert("Falha ao redirecionar para a janela do Google.");
            });
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                const nomeCurto = user.displayName.split(" ")[0]; 
                document.getElementById("displayNome").innerText = nomeCurto;
                
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-app").style.display = "flex";

                await carregarDadosDoBanco();
            } else {
                usuarioAtual = null;
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
                iniciarAlbumHTML(); 
            }
        });

        async function carregarDadosDoBanco() {
            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const docSnap = await getDoc(userRef);

            if (docSnap.exists()) {
                const dados = docSnap.data();
                renderizarCartasNaTela(dados.cartas_desbloqueadas || [], dados.nome);
            } else {
                await setDoc(userRef, {
                    nome: usuarioAtual.displayName,
                    email: usuarioAtual.email,
                    cartas_desbloqueadas: [],
                    codigos_usados: []
                });
                renderizarCartasNaTela([], usuarioAtual.displayName.split(" ")[0]);
            }
        }

        function renderizarCartasNaTela(arrayDeIds, nomeJogador) {
            iniciarAlbumHTML(); 
            const watermarks = document.querySelectorAll('.watermark');
            watermarks.forEach(wm => wm.innerText = nomeJogador);

            arrayDeIds.forEach((cartaId, index) => {
                if (index < TOTAL_SLOTS) {
                    const slot = document.getElementById(`slot-${index + 1}`);
                    const cartaDados = cartasDisponiveis.find(c => c.id === cartaId);
                    
                    if (cartaDados) {
                        slot.querySelector('img').src = cartaDados.imagem;
                        slot.classList.add('revealed');
                    }
                }
            });
        }

        document.getElementById('btnResgatar').addEventListener('click', async () => {
            const input = document.getElementById("codigoInput");
            const codigoDigitado = input.value.trim().toUpperCase();

            if (!codigosValidos.includes(codigoDigitado)) {
                alert("Código inválido ou os Deuses já o consumiram.");
                return;
            }

            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const docSnap = await getDoc(userRef);
            const dados = docSnap.data();

            if (dados.codigos_usados && dados.codigos_usados.includes(codigoDigitado)) {
                alert("Este feitiço já foi lançado por você!");
                return;
            }

            if (dados.cartas_desbloqueadas && dados.cartas_desbloqueadas.length >= TOTAL_SLOTS) {
                alert("Seu compêndio já está completo!");
                return;
            }

            alert("Código aceito! Invocando novas cartas...");
            
            let cartasJaTiradas = dados.cartas_desbloqueadas ? dados.cartas_desbloqueadas.length : 0;
            let cartasParaSortear = Math.min(3, TOTAL_SLOTS - cartasJaTiradas);
            let novasCartasIds = [];

            for (let i = 0; i < cartasParaSortear; i++) {
                const sorteada = cartasDisponiveis[Math.floor(Math.random() * cartasDisponiveis.length)];
                novasCartasIds.push(sorteada.id);
            }

            await updateDoc(userRef, {
                cartas_desbloqueadas: arrayUnion(...novasCartasIds),
                codigos_usados: arrayUnion(codigoDigitado)
            });

            input.value = "";
            await carregarDadosDoBanco(); 
        });

        document.getElementById('btnShare').addEventListener('click', async () => {
            const albumContainer = document.body;
            const botoesEsconder = document.querySelectorAll('.hide-on-print');
            
            botoesEsconder.forEach(el => el.style.display = 'none');

            try {
                const canvas = await html2canvas(albumContainer, { backgroundColor: '#070709', scale: 2 });
                canvas.toBlob(async (blob) => {
                    const nomeCurto = usuarioAtual ? usuarioAtual.displayName.split(" ")[0] : "Jogador";
                    
                    const imgURL = canvas.toDataURL("image/png");
                    const link = document.createElement("a");
                    link.download = `compendio-${nomeCurto}.png`;
                    link.href = imgURL;
                    link.click();

                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        alert("Compêndio forjado e copiado! Use Ctrl+V no WhatsApp para compartilhar.");
                    } catch (err) {
                        alert("Imagem salva nas suas transferências! Arraste para o WhatsApp.");
                    }
                });
            } catch (error) {
                console.error("Erro ao gerar a imagem:", error);
            } finally {
                botoesEsconder.forEach(el => el.style.display = 'flex');
            }
        });

        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
