<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era das Tavernas - Compendium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: rgba(12, 12, 15, 0.4);
            --gold: #d4af37;
            --gold-dim: #8a7322;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --text-light: #d1d1d1;
            --font-epic: 'Cinzel', serif;
            --card-width: 167px;
            --card-height: 224px;
            --card-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
            background-image: radial-gradient(circle at 50% 0%, #15151a 0%, var(--bg-dark) 100%);
            overflow-x: hidden;
        }

        h1, h2, h3, input, button { font-family: var(--font-epic); }

        /* --- TELAS DE ACESSO --- */
        #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .login-box { 
            background-color: #0c0c0f; padding: 3rem; border: 1px solid #15151a; border-top: 1px solid var(--gold-dim);
            text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); width: 400px;
        }
        .login-box h2 { color: var(--gold); font-size: 2rem; margin-bottom: 2rem; letter-spacing: 4px; }

        .auth-tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #1a1a1f; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.9rem; padding: 5px 10px; transition: 0.3s; letter-spacing: 1px;}
        .tab-btn.active { color: var(--gold); border-bottom: 1px solid var(--gold); }

        .auth-form { display: flex; flex-direction: column; gap: 15px; display: none; }
        .auth-form.active { display: flex; }
        .auth-form input { background: #050505; border: 1px solid #222; color: var(--gold); padding: 12px; text-align: center; width: 100%; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .auth-form input:focus { border-color: var(--gold-dim); }

        .divider { margin: 25px 0; border-top: 1px solid #1a1a1f; position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #0c0c0f; padding: 0 10px; color: #444; font-size: 0.7rem; font-family: var(--font-epic); letter-spacing: 1px; }

        /* --- CONTEÚDO PRINCIPAL --- */
        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; padding: 0 2rem 4rem; }
        
        .container { 
            background-color: transparent; 
            border-top: 1px solid rgba(212, 175, 55, 0.2); 
            padding: 3rem 0; 
            width: 100%; max-width: 1050px; 
            text-align: center; 
            margin-top: 80px; 
            position: relative; 
        }
        
        .hero-seal { width: 50px; height: 50px; background: var(--bg-dark); border: 1px solid var(--gold-dim); position: absolute; top: -25px; left: 50%; transform: translateX(-50%) rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .hero-seal::after { content: ""; width: 8px; height: 8px; background: var(--gold-dim); transform: rotate(-45deg); border-radius: 50%; }

        h1 { font-size: 2.2rem; letter-spacing: 3px; font-weight: 400; margin-bottom: 0.5rem; color: var(--text-light); text-transform: uppercase; }
        .subtitle { color: #555; font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 2.5rem; text-transform: uppercase; }

        /* --- CONTROLES --- */
        .controls-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 3.5rem; }

        .input-group { display: flex; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; }
        .input-group input { background: #0a0a0c; border: 1px solid #1f1f24; border-right: none; color: var(--gold); padding: 12px 25px; font-size: 1rem; outline: none; width: 260px; text-align: center; letter-spacing: 2px; transition: 0.3s; }
        .input-group input:focus { background: #000; border-color: var(--gold-dim); }
        
        button { background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); padding: 12px 25px; cursor: pointer; transition: 0.3s; font-weight: 400; letter-spacing: 2px; }
        button:hover { background: var(--gold-glow); }
        
        .btn-invocar { background: #0c0c0f; color: var(--gold); border: 1px solid var(--gold-dim); font-weight: 700; }
        .btn-invocar:hover { background: var(--gold); color: #000; }

        .btn-share { background: transparent; color: #666; border: 1px solid #222; font-size: 0.75rem; padding: 8px 24px; border-radius: 30px; letter-spacing: 1px; }
        .btn-share:hover { border-color: var(--gold-dim); color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        
        .btn-google { border-color: #222; color: #666; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .btn-google:hover { border-color: #fff; color: #fff; background: transparent; }
        .btn-logout { font-size: 0.7rem; border: none; color: #444; text-decoration: underline; margin-top: 50px; padding: 5px; }
        .btn-logout:hover { background: transparent; color: var(--gold); }

        /* --- GRID E CARTAS --- */
        .special-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 3.5rem;
        }

        .special-card {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.5);
            border: 1px solid var(--gold);
        }

        .special-card:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.8);
        }

        .album-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr)); 
            gap: 25px; 
            justify-items: center;
        }
        
        .card { 
            width: var(--card-width); 
            height: var(--card-height); 
            background: transparent; 
            border-radius: var(--card-radius);
            position: relative; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: default;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        .card.revealed { 
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
        }

        .card.revealed:not(.special-card):hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.15); }
        .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; border-radius: var(--card-radius); transition: 0.3s; }
        .card:not(.revealed) img { opacity: 1; filter: none; }

        /* --- POPUP / MODAL --- */
        #card-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; animation: fadeIn 0.3s ease; backdrop-filter: blur(5px); }
        #modal-img { max-width: 90%; max-height: 85vh; border-radius: var(--card-radius); box-shadow: 0 0 50px rgba(0,0,0,1); animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        /* --- ANIMAÇÃO POLIDA DO PACOTE E REVELAÇÃO 3D --- */
        #summon-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(12,12,15,0.95) 0%, rgba(0,0,0,0.98) 100%);
            z-index: 9999; display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .pack-base {
            width: 180px; height: 242px; border-radius: var(--card-radius);
            background-image: url('card_verso.jpeg'); background-size: cover; background-position: center;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.6);
            cursor: pointer; transition: transform 0.3s ease, filter 0.3s;
            animation: float-pack 3s ease-in-out infinite;
            position: relative;
        }

        .pack-base::after {
            content: "CLIQUE PARA REVELAR A CARTA"; position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%);
            color: var(--gold); font-family: var(--font-epic); font-size: 0.85rem; letter-spacing: 2px; white-space: nowrap;
            animation: pulse-text 1.5s infinite;
        }

        .pack-base:hover { transform: scale(1.05); box-shadow: 0 0 90px rgba(212, 175, 55, 1); filter: brightness(1.2); }
        .pack-base.shaking { animation: shake-pack 0.4s cubic-bezier(.36,.07,.19,.97) both infinite; }
        .pack-base.explode { transform: scale(1.5); opacity: 0; filter: brightness(3); transition: 0.5s; pointer-events: none; }
        
        /* Estrutura 3D */
        .anim-card-wrapper {
            position: fixed; width: var(--card-width); height: var(--card-height);
            left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.1);
            perspective: 1500px; z-index: 10000; opacity: 0; pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease, left 1.2s ease-in-out, top 1.2s ease-in-out, width 1.2s ease-in-out, height 1.2s ease-in-out;
        }

        .anim-card-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Salto elástico na virada */
            border-radius: var(--card-radius);
        }

        /* O giro principal chamando a sombra branca explosiva */
        .anim-card-inner.flip {
            transform: rotateY(180deg);
            animation: white-blast-shadow 1.5s ease-out forwards;
        }

        .anim-card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .anim-card-back { background: url('card_verso.jpeg') center/cover; box-shadow: 0 0 20px rgba(212,175,55,0.4); }
        .anim-card-front { transform: rotateY(180deg); background: #000; }
        .anim-card-front img { width: 100%; height: 100%; object-fit: cover; }

        /* O Flash Branco (Efeito Cegante) que surge na frente da carta e apaga */
        .anim-card-inner.flip .anim-card-front::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            animation: pure-white-flash 1.2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes pure-white-flash {
            0% { opacity: 1; }
            15% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes white-blast-shadow {
            0% { box-shadow: 0 0 0px rgba(255,255,255,0); }
            15% { box-shadow: 0 0 150px rgba(255,255,255,1), 0 0 80px rgba(255,255,255,0.9); }
            100% { box-shadow: 0 0 40px rgba(212,175,55,0.8); }
        }

        @keyframes float-pack { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulse-text { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes shake-pack {
            0%, 100% { transform: translateX(0) scale(1.05); }
            25% { transform: translateX(-8px) rotate(-3deg) scale(1.05); }
            75% { transform: translateX(8px) rotate(3deg) scale(1.05); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .hide-on-print { display: flex; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>TAVERNA</h2>
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLogin">ENTRAR</button>
                <button class="tab-btn" id="tabSignup">CRIAR CONTA</button>
            </div>
            <div class="auth-form active" id="formLogin">
                <input type="email" id="emailLogin" placeholder="E-MAIL">
                <input type="password" id="passLogin" placeholder="SENHA">
                <button id="btnEmailLogin">Acessar</button>
            </div>
            <div class="auth-form" id="formSignup">
                <input type="text" id="nameSignup" placeholder="NOME DE JOGADOR">
                <input type="email" id="emailSignup" placeholder="E-MAIL">
                <input type="password" id="passSignup" placeholder="SENHA">
                <button id="btnEmailSignup">Registrar</button>
            </div>
            <div class="divider"><span>OU</span></div>
            <button id="btnGoogleLogin" class="btn-google">Acessar com Google</button>
        </div>
    </div>

    <!-- Overlay da Animação do Pacote 3D -->
    <div id="summon-overlay" class="hide-on-print">
        <div id="pack-element" class="pack-base"></div>
    </div>

    <div id="main-app">
        <div class="container" id="album-container">
            <div class="hero-seal"></div>
            <h1>Compêndio de <span id="displayNome" style="color: #fff;"></span></h1>
            <p class="subtitle hide-on-print">Panteão dos Deuses</p>
            
            <div class="controls-wrapper hide-on-print">
                <div class="input-group">
                    <input type="text" id="codigoInput" placeholder="CÓDIGO" maxlength="25">
                    <button id="btnResgatar" class="btn-invocar">INVOCAR</button>
                </div>
                <button id="btnShare" class="btn-share">Copiar Compêndio</button>
            </div>

            <div id="specialCardContainer" class="special-container"></div>

            <div class="album-grid" id="albumGrid"></div>
            
            <button id="btnLogout" class="btn-logout hide-on-print">Abandonar Taverna</button>
        </div>
    </div>

    <div id="card-modal" class="hide-on-print">
        <img id="modal-img" src="" alt="Carta Expandida">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpWcTqqQ14qNd0LAZcF8hWdc27snlBzRk",
            authDomain: "album-de-cartas-59265.firebaseapp.com",
            projectId: "album-de-cartas-59265",
            storageBucket: "album-de-cartas-59265.firebasestorage.app",
            messagingSenderId: "1083766972634",
            appId: "1:1083766972634:web:eb725ea6afbddc102385e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;

        const NOMES_DOS_DEUSES = ["amaterasu", "susanoo", "tsukuyomi", "quetzalcoatl", "huitzilopochtli", "tezcatlipoca","ra", "isis", "set", "zeus", "hades", "poseidon", "demeter", "freyr", "odin", "thor", "loki", "shennong", "fuxi", "nuwa", "cronos", "urano", "gaia"];
        const TOTAL_SLOTS = NOMES_DOS_DEUSES.length;
        
        const cartasDisponiveis = NOMES_DOS_DEUSES.map((nome, index) => ({
            id: index + 1,
            imagem: `card_${nome}.jpeg` 
        }));

        const modal = document.getElementById('card-modal');
        const modalImg = document.getElementById('modal-img');
        modal.onclick = () => modal.style.display = 'none';

        function openModal(imgSrc) {
            modalImg.src = imgSrc;
            modal.style.display = 'flex';
        }

        document.getElementById('tabLogin').onclick = () => {
            document.getElementById('formLogin').classList.add('active');
            document.getElementById('formSignup').classList.remove('active');
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabSignup').classList.remove('active');
        };
        document.getElementById('tabSignup').onclick = () => {
            document.getElementById('formSignup').classList.add('active');
            document.getElementById('formLogin').classList.remove('active');
            document.getElementById('tabSignup').classList.add('active');
            document.getElementById('tabLogin').classList.add('active');
        };

        document.getElementById('btnGoogleLogin').onclick = () => signInWithPopup(auth, provider);

        document.getElementById('btnEmailSignup').onclick = async () => {
            const name = document.getElementById('nameSignup').value.trim();
            const email = document.getElementById('emailSignup').value.trim();
            const pass = document.getElementById('passSignup').value;
            if (!name || !email || !pass) return alert("Preencha todos os campos.");
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                await setDoc(doc(db, "usuarios", res.user.uid), { nome: name, email: email, cartas_desbloqueadas: [], codigos_usados: [] });
                location.reload(); 
            } catch (e) { alert("Erro ao cadastrar: " + e.message); }
        };

        document.getElementById('btnEmailLogin').onclick = () => {
            const email = document.getElementById('emailLogin').value.trim();
            const pass = document.getElementById('passLogin').value;
            if (!email || !pass) return alert("Preencha os campos.");
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro: " + e.message));
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-app").style.display = "flex";
                await carregarDados();
            } else {
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
            }
        });

        async function carregarDados() {
            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const snap = await getDoc(userRef);
            let nomeParaExibir = usuarioAtual.displayName || "Guerreiro";
            
            if (snap.exists()) {
                const dados = snap.data();
                nomeParaExibir = dados.nome || nomeParaExibir;
                
                let cartasSalvas = dados.cartas_desbloqueadas || [];
                let cartaEspecial = dados.carta_especial;

                const cartasUnicas = new Set(cartasSalvas.map(Number));
                
                if (cartasUnicas.size >= TOTAL_SLOTS && !cartaEspecial) {
                    cartaEspecial = Math.floor(Math.random() * 4) + 1;
                    await updateDoc(userRef, { carta_especial: cartaEspecial });
                }

                renderizarGrid(cartasSalvas, cartaEspecial);
            } else {
                await setDoc(userRef, { nome: nomeParaExibir, email: usuarioAtual.email, cartas_desbloqueadas: [], codigos_usados: [] });
                renderizarGrid([]);
            }
            document.getElementById("displayNome").innerText = nomeParaExibir.toUpperCase();
        }

        function renderizarGrid(cartasIds, cartaEspecialId) {
            const specialContainer = document.getElementById('specialCardContainer');
            specialContainer.innerHTML = '';
            
            if (cartaEspecialId) {
                const specialImg = `especial_${cartaEspecialId}.jpeg`; 
                const specialCardDiv = document.createElement('div');
                specialCardDiv.className = 'card revealed special-card';
                specialCardDiv.innerHTML = `<img src="${specialImg}" style="display:block">`;
                specialCardDiv.onclick = () => openModal(specialImg);
                specialContainer.appendChild(specialCardDiv);
            }

            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            const cartasSeguras = cartasIds.map(id => Number(id));

            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const temEssaCarta = cartasSeguras.includes(i);
                const cartaDados = cartasDisponiveis.find(c => c.id === i);
                
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card' + (temEssaCarta ? ' revealed' : '');
                
                if (temEssaCarta && cartaDados) {
                    cardDiv.innerHTML = `<img src="${cartaDados.imagem}" style="display:block">`;
                    cardDiv.onclick = () => openModal(cartaDados.imagem);
                } else {
                    cardDiv.innerHTML = `<img src="card_verso.jpeg" style="display:block">`;
                }
                grid.appendChild(cardDiv);
            }
        }

        // --- SISTEMA DE ANIMAÇÃO 3D SUPER POLIDO ---
        function executarAnimacao(itens) {
            return new Promise(resolve => {
                const overlay = document.getElementById('summon-overlay');
                const pack = document.getElementById('pack-element');
                
                overlay.style.display = 'flex';
                pack.className = 'pack-base'; 
                pack.style.opacity = '1';
                pack.style.display = 'block';
                pack.style.filter = 'none';
                
                document.querySelectorAll('.anim-card-wrapper').forEach(e => e.remove());

                pack.onclick = async () => {
                    pack.onclick = null;
                    pack.classList.add('shaking');
                    
                    await new Promise(r => setTimeout(r, 1000)); 
                    
                    pack.classList.remove('shaking');
                    pack.classList.add('explode');
                    
                    await new Promise(r => setTimeout(r, 400));
                    pack.style.display = 'none';

                    const animCards = [];
                    const scaleNormal = 1.3;
                    const scaleHighlight = 1.6;

                    itens.forEach((item, index) => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'anim-card-wrapper';
                        
                        const inner = document.createElement('div');
                        inner.className = 'anim-card-inner';
                        
                        const faceBack = document.createElement('div');
                        faceBack.className = 'anim-card-face anim-card-back';
                        
                        const faceFront = document.createElement('div');
                        faceFront.className = 'anim-card-face anim-card-front';
                        
                        const img = document.createElement('img');
                        img.src = item.isSpecial ? `especial_${item.id}.jpeg` : cartasDisponiveis.find(c => c.id === item.id).imagem;
                        
                        faceFront.appendChild(img);
                        inner.appendChild(faceBack);
                        inner.appendChild(faceFront);
                        wrapper.appendChild(inner);
                        overlay.appendChild(wrapper);
                        
                        animCards.push({ wrapper, inner, item });

                        // Surgem viradas para baixo e se espalham
                        setTimeout(() => {
                            const offset = (index - (itens.length - 1) / 2) * 200;
                            wrapper.style.transform = `translate(calc(-50% + ${offset}px), -50%) scale(${scaleNormal})`;
                            wrapper.style.opacity = '1';
                        }, 100 * index);
                    });

                    // Pausa de suspense
                    await new Promise(r => setTimeout(r, 1200));

                    // Revelação Épica (Flash Branco) - Uma a uma para mostrar bem a carta ganha!
                    animCards.forEach(({wrapper, inner}, index) => {
                        setTimeout(() => {
                            // Traz a carta mais pra frente pra mostrar a glória
                            const offset = (index - (itens.length - 1) / 2) * 200;
                            wrapper.style.transform = `translate(calc(-50% + ${offset}px), -50%) scale(${scaleHighlight})`;
                            wrapper.style.zIndex = "1000" + index; 
                            
                            // Gira com explosão branca!
                            inner.classList.add('flip');
                        }, index * 600); // 600ms de intervalo entre as revelações
                    });

                    // Dá bastante tempo para o jogador admirar a arte das cartas reveladas
                    const waitTime = 3000 + (animCards.length * 600);
                    await new Promise(r => setTimeout(r, waitTime));

                    // Voar para o álbum físico
                    animCards.forEach(({wrapper, item}) => {
                        let target = null;
                        if (item.isSpecial) {
                            target = document.getElementById('specialCardContainer');
                        } else {
                            const slots = document.querySelectorAll('.album-grid .card');
                            target = slots[item.id - 1];
                        }

                        if (target) {
                            const rect = target.getBoundingClientRect();
                            wrapper.style.transform = 'none';
                            wrapper.style.left = `${rect.left}px`;
                            wrapper.style.top = `${rect.top}px`;
                            wrapper.style.width = `${rect.width}px`;
                            wrapper.style.height = `${rect.height}px`;
                            wrapper.style.opacity = '0'; // Some sutilmente ao encaixar
                        }
                    });

                    await new Promise(r => setTimeout(r, 1200));
                    
                    overlay.style.display = 'none';
                    document.querySelectorAll('.anim-card-wrapper').forEach(e => e.remove());
                    resolve();
                };
            });
        }

        document.getElementById('btnResgatar').onclick = async () => {
            const cod = document.getElementById("codigoInput").value.trim().toUpperCase();
            if (!cod) return alert("Mestre, insira um código válido.");

            const codigoRef = doc(db, "codigos", cod);
            const codigoSnap = await getDoc(codigoRef);

            if (!codigoSnap.exists() || codigoSnap.data().ativo === false) {
                return alert("Código inválido, expirado ou selado pelos deuses.");
            }

            const dadosCodigo = codigoSnap.data();

            if (dadosCodigo.expira_em) {
                const dataExpiracao = dadosCodigo.expira_em.toDate();
                const agora = new Date();
                if (agora > dataExpiracao) return alert("A magia deste código já se dissipou no tempo! (Expirado)");
            }

            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const snap = await getDoc(userRef);
            const d = snap.data();
            
            if (d.codigos_usados?.includes(cod)) return alert("Este feitiço já foi lançado por você!");

            let cartasParaAdicionar = [];

            if (dadosCodigo.cartas_recompensa && dadosCodigo.cartas_recompensa.length > 0) {
                cartasParaAdicionar = dadosCodigo.cartas_recompensa.map(id => Number(id));
            } else {
                if (d.cartas_desbloqueadas.length >= TOTAL_SLOTS) return alert("Seu compêndio já está completo!");
                for (let i = 0; i < Math.min(3, TOTAL_SLOTS - d.cartas_desbloqueadas.length); i++) {
                    const indexSorteado = Math.floor(Math.random() * NOMES_DOS_DEUSES.length);
                    cartasParaAdicionar.push(cartasDisponiveis[indexSorteado].id);
                }
            }

            const cartasAtuais = d.cartas_desbloqueadas || [];
            const arrayAtualConvertido = cartasAtuais.map(Number);
            const arrayNovoConvertido = cartasParaAdicionar.map(Number);
            const todasAsCartas = new Set([...arrayAtualConvertido, ...arrayNovoConvertido]);
            
            let updateData = { cartas_desbloqueadas: arrayUnion(...cartasParaAdicionar), codigos_usados: arrayUnion(cod) };
            let ganhouEspecial = false;
            
            if (todasAsCartas.size >= TOTAL_SLOTS && !d.carta_especial) {
                updateData.carta_especial = Math.floor(Math.random() * 4) + 1;
                ganhouEspecial = true;
            }

            // Banco atualiza ANTES
            await updateDoc(userRef, updateData);
            document.getElementById("codigoInput").value = "";

            let itensParaAnimar = cartasParaAdicionar.map(id => ({ id: id, isSpecial: false }));
            if (ganhouEspecial) itensParaAnimar.push({ id: updateData.carta_especial, isSpecial: true });

            // Chama o show 3D
            await executarAnimacao(itensParaAnimar);
            await carregarDados();
        };

        document.getElementById('btnShare').onclick = async () => {
            document.querySelectorAll('.hide-on-print').forEach(e => e.style.display = 'none');
            const canvas = await html2canvas(document.body, { backgroundColor: '#070709', scale: 2 });
            canvas.toBlob(async (blob) => {
                const imgURL = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                link.download = `compendio.png`;
                link.href = imgURL;
                link.click();
                try {
                    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                    alert("Copiado! Cole diretamente no WhatsApp (Ctrl+V).");
                } catch { alert("Salvo nos downloads!"); }
                document.querySelectorAll('.hide-on-print').forEach(e => e.style.display = 'flex');
            });
        };
    </script>
