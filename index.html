<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era das Tavernas - Compendium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: #141417;
            --gold: #d4af37;
            --gold-dim: #8a7322;
            --text-light: #e0e0e0;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; background: radial-gradient(circle, #1a1a1f 0%, var(--bg-dark) 100%); }
        .login-box { background-color: var(--panel-bg); padding: 3rem; border: 1px solid var(--gold-dim); border-radius: var(--border-radius); text-align: center; box-shadow: 0 0 30px rgba(212, 175, 55, 0.1); }
        .login-box h2 { color: var(--gold); margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }

        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; padding: 2rem; }
        .container { background-color: var(--panel-bg); border: 1px solid #2a2a2e; border-radius: var(--border-radius); padding: 3rem 2rem 2rem; width: 100%; max-width: 1000px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-top: 50px; position: relative; }
        .hero-seal { width: 120px; height: 120px; background: radial-gradient(circle, var(--panel-bg) 0%, var(--bg-dark) 100%); border: 2px solid var(--gold-dim); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: absolute; top: -50px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .hero-seal::after { content: "⚔️"; font-size: 2.5rem; }

        h1 { font-size: 2rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-top: 2rem; margin-bottom: 0.5rem; }
        p { color: #888; margin-bottom: 2rem; }

        input { background-color: #000; border: 1px solid var(--gold-dim); color: var(--gold); padding: 12px 20px; border-radius: 4px; font-size: 1rem; outline: none; width: 250px; transition: border-color 0.3s ease; text-transform: uppercase; }
        input:focus { border-color: var(--gold); }
        .input-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 2rem; }

        button { background-color: var(--gold-dim); color: #000; border: none; padding: 12px 24px; font-weight: bold; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; }
        button:hover { background-color: var(--gold); transform: scale(1.05); }
        .btn-google { background-color: #fff; color: #333; display: flex; align-items: center; gap: 10px; margin: 0 auto; }
        .btn-google:hover { background-color: #eee; transform: scale(1.05); }
        .btn-share { background-color: #25D366; color: white; margin-bottom: 2rem; display: flex; align-items: center; gap: 8px; margin-left: auto; margin-right: auto; }
        .btn-share:hover { background-color: #128C7E; }
        .btn-logout { background-color: #333; color: #fff; font-size: 0.8rem; padding: 8px 16px; margin-top: 20px; }
        .btn-logout:hover { background-color: #555; }

        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; justify-items: center; padding-top: 1rem; border-top: 1px solid #2a2a2e; }
        .card { width: 160px; height: 220px; background-color: #0f0f11; border: 2px dashed #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: all 0.5s ease; user-select: none; }
        .card.revealed { border: 2px solid var(--gold); border-style: solid; background-color: #1a1a1a; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
        .card.revealed img { display: block; }
        .card-placeholder { color: #333; font-size: 2.5rem; }
        .card.revealed .card-placeholder { display: none; }
        .watermark { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); background: rgba(0, 0, 0, 0.8); padding: 3px 0; display: none; font-weight: bold; letter-spacing: 1px; }
        .card.revealed .watermark { display: block; }
        .hide-on-print { display: flex; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Portões da Taverna</h2>
            <p style="margin-bottom: 20px;">Identifique-se para acessar seu compêndio.</p>
            <button id="btnGoogleLogin" class="btn-google">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                Entrar com Google
            </button>
        </div>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="main-app">
        <div class="container" id="album-container">
            <div class="hero-seal"></div>
            <h1>Compêndio de <span id="displayNome" style="color: #fff;"></span></h1>
            
            <p class="hide-on-print">Insira seu código para invocar cartas para o seu álbum.</p>

            <div class="input-group hide-on-print">
                <input type="text" id="codigoInput" placeholder="DIGITE O CÓDIGO" maxlength="15">
                <button id="btnResgatar">Resgatar</button>
            </div>

            <button id="btnShare" class="btn-share hide-on-print">📱 Compartilhar no WhatsApp</button>

            <div class="album-grid" id="albumGrid">
                <!-- Slots gerados via JS -->
            </div>

            <button id="btnLogout" class="btn-logout hide-on-print">Sair da Conta</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpWcTqqQ14qNd0LAZcF8hWdc27snlBzRk",
            authDomain: "album-de-cartas-59265.firebaseapp.com",
            projectId: "album-de-cartas-59265",
            storageBucket: "album-de-cartas-59265.firebasestorage.app",
            messagingSenderId: "1083766972634",
            appId: "1:1083766972634:web:eb725ea6afbddc102385e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        const TOTAL_SLOTS = 10;
        
        const cartasDisponiveis = [
            { id: 1, imagem: "https://via.placeholder.com/160x220/111111/d4af37?text=Map:+Acropolis" },
            { id: 2, imagem: "https://via.placeholder.com/160x220/111111/d4af37?text=Map:+Alfheim" },
            { id: 3, imagem: "https://via.placeholder.com/160x220/111111/d4af37?text=God:+Odin" },
            { id: 4, imagem: "https://via.placeholder.com/160x220/111111/d4af37?text=God:+Zeus" },
            { id: 5, imagem: "https://via.placeholder.com/160x220/111111/d4af37?text=God:+Isis" },
            { id: 6, imagem: "https://via.placeholder.com/160x220/111111/d4af37?text=Player+Elite" }
        ];

        const codigosValidos = ["TAVERNA-LIVE", "EPICO2026", "BRIGA-BAR"];

        function iniciarAlbumHTML() {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                grid.innerHTML += `
                    <div class="card" id="slot-${i}">
                        <div class="card-placeholder">?</div>
                        <img src="" alt="Carta">
                        <div class="watermark"></div>
                    </div>
                `;
            }
        }
        iniciarAlbumHTML();

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => {
                console.error("Erro no login:", error);
                alert("Falha ao abrir a janela do Google. Tente desativar o bloqueador de pop-ups.");
            });
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                const nomeCurto = user.displayName.split(" ")[0]; 
                document.getElementById("displayNome").innerText = nomeCurto;
                
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-app").style.display = "flex";

                await carregarDadosDoBanco();
            } else {
                usuarioAtual = null;
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
                iniciarAlbumHTML(); 
            }
        });

        async function carregarDadosDoBanco() {
            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const docSnap = await getDoc(userRef);

            if (docSnap.exists()) {
                const dados = docSnap.data();
                renderizarCartasNaTela(dados.cartas_desbloqueadas || [], dados.nome);
            } else {
                await setDoc(userRef, {
                    nome: usuarioAtual.displayName,
                    email: usuarioAtual.email,
                    cartas_desbloqueadas: [],
                    codigos_usados: []
                });
                renderizarCartasNaTela([], usuarioAtual.displayName.split(" ")[0]);
            }
        }

        function renderizarCartasNaTela(arrayDeIds, nomeJogador) {
            iniciarAlbumHTML(); 
            const watermarks = document.querySelectorAll('.watermark');
            watermarks.forEach(wm => wm.innerText = nomeJogador);

            arrayDeIds.forEach((cartaId, index) => {
                if (index < TOTAL_SLOTS) {
                    const slot = document.getElementById(`slot-${index + 1}`);
                    const cartaDados = cartasDisponiveis.find(c => c.id === cartaId);
                    
                    if (cartaDados) {
                        slot.querySelector('img').src = cartaDados.imagem;
                        slot.classList.add('revealed');
                    }
                }
            });
        }

        document.getElementById('btnResgatar').addEventListener('click', async () => {
            const input = document.getElementById("codigoInput");
            const codigoDigitado = input.value.trim().toUpperCase();

            if (!codigosValidos.includes(codigoDigitado)) {
                alert("Código inválido ou não existe.");
                return;
            }

            const userRef = doc(db, "usuarios", usuarioAtual.uid);
            const docSnap = await getDoc(userRef);
            const dados = docSnap.data();

            if (dados.codigos_usados && dados.codigos_usados.includes(codigoDigitado)) {
                alert("Você já usou este código!");
                return;
            }

            if (dados.cartas_desbloqueadas && dados.cartas_desbloqueadas.length >= TOTAL_SLOTS) {
                alert("Seu álbum já está cheio!");
                return;
            }

            alert("Código aceito! Os Deuses lhe enviam um pacote...");
            
            let cartasJaTiradas = dados.cartas_desbloqueadas ? dados.cartas_desbloqueadas.length : 0;
            let cartasParaSortear = Math.min(3, TOTAL_SLOTS - cartasJaTiradas);
            let novasCartasIds = [];

            for (let i = 0; i < cartasParaSortear; i++) {
                const sorteada = cartasDisponiveis[Math.floor(Math.random() * cartasDisponiveis.length)];
                novasCartasIds.push(sorteada.id);
            }

            await updateDoc(userRef, {
                cartas_desbloqueadas: arrayUnion(...novasCartasIds),
                codigos_usados: arrayUnion(codigoDigitado)
            });

            input.value = "";
            await carregarDadosDoBanco(); 
        });

        document.getElementById('btnShare').addEventListener('click', async () => {
            const albumContainer = document.getElementById('album-container');
            const botoesEsconder = document.querySelectorAll('.hide-on-print');
            botoesEsconder.forEach(el => el.style.display = 'none');

            try {
                const canvas = await html2canvas(albumContainer, { backgroundColor: '#141417', scale: 2 });
                canvas.toBlob(async (blob) => {
                    const nomeCurto = usuarioAtual ? usuarioAtual.displayName.split(" ")[0] : "Jogador";
                    const file = new File([blob], `album-${nomeCurto}.png`, { type: "image/png" });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'Meu Compêndio - Era das Tavernas',
                            text: `Olha as cartas que eu tirei no torneio!`,
                            files: [file]
                        });
                    } else {
                        const imgURL = canvas.toDataURL("image/png");
                        const link = document.createElement("a");
                        link.download = `album-${nomeCurto}.png`;
                        link.href = imgURL;
                        link.click();
                        alert("Imagem salva no seu computador! Agora é só arrastar para o WhatsApp Web.");
                    }
                });
            } catch (error) {
                console.error("Erro ao gerar a imagem:", error);
            } finally {
                botoesEsconder.forEach(el => el.style.display = 'flex');
            }
        });

        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
